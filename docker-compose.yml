version: '3.8'

services:
  db:
    image: postgres:15
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=admin
    ports:
      - "5432:5432"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres" ]
      interval: 10s
      timeout: 5s
      retries: 5

  service-registry:
    build: ./backend/service-registry
    ports:
      - "8761:8761"
    environment:
      - SPRING_PROFILES_ACTIVE=docker

  user-service:
    build: ./backend/user-service
    ports:
      - "8082:8082"
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://service-registry:8761/eureka/
      - SPRING_DATASOURCE_URL=jdbc:postgresql://db:5432/userdb
    depends_on:
      - service-registry
      - db

  question-service:
    build: ./backend/question-service
    ports:
      - "8081:8081"
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://service-registry:8761/eureka/
      - SPRING_DATASOURCE_URL=jdbc:postgresql://db:5432/questiondb
    depends_on:
      - service-registry
      - db

  quiz-service:
    build: ./backend/quiz-service
    ports:
      - "8090:8090"
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://service-registry:8761/eureka/
      - SPRING_DATASOURCE_URL=jdbc:postgresql://db:5432/quizdb
    depends_on:
      - service-registry
      - db

  frontend-user:
    build: ./frontend/user
    ports:
      - "3001:80"
    depends_on:
      - user-service
      - question-service
      - quiz-service

  frontend-admin:
    build: ./frontend/admin
    ports:
      - "3000:80"
    depends_on:
      - question-service
      - quiz-service
