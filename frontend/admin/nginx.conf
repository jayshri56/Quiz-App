server {
    listen 10000;
    
    # Use Docker/Render internal DNS
    resolver 127.0.0.11 valid=30s;

    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
    }

    # Proxy API requests to backend services
    location /quiz {
        set $backend "http://quiz-service:8090";
        proxy_pass $backend;
    }

    location /question {
        set $backend "http://question-service:8081";
        proxy_pass $backend;
    }

    location /user {
        set $backend "http://user-service:8082";
        proxy_pass $backend;
    }
}
