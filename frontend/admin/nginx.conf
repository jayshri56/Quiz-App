server {
    listen 10000;
    
    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
    }

    # Proxy API requests to Public Render URLs (for Free Tier compatibility)
    location /quiz {
        proxy_pass https://quiz-service-jtcm.onrender.com;
        proxy_ssl_server_name on;
    }

    location /question {
        proxy_pass https://question-service-pqb2.onrender.com;
        proxy_ssl_server_name on;
    }

    location /user {
        proxy_pass https://user-service-ut4n.onrender.com;
        proxy_ssl_server_name on;
    }
}
